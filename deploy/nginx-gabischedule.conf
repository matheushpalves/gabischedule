# /etc/nginx/sites-available/gabischedule
# Depois de ativar, rode: sudo certbot --nginx -d gabischedule.duckdns.org --redirect
# (o certbot acrescenta o bloco HTTPS/443 e o redirecionamento automaticamente).
server {
    listen 80;
    listen [::]:80;
    server_name gabischedule.duckdns.org;

    root /var/www/gabi/public;
    index index.html;

    # Cabeçalhos de segurança (nenhum `location` abaixo usa add_header, então são herdados).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # API → backend Node (systemd: gabi-api.service). A porta precisa bater com PORT em /etc/gabi/api.env.
    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real do cliente (usado no bloqueio de tentativas de login). Substitui, não acrescenta,
        # para que o cliente não consiga forjar o cabeçalho.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # index.html, sw.js, manifest e rotas do app: sempre revalidar; rotas desconhecidas caem no index.html (SPA).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
