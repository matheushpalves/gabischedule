<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gabi — Tarefas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2336A}a:hover{color:#8E1F4C}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF5F7; font-family: Nunito, system-ui, sans-serif; color: #4A1F3D; box-sizing: border-box">
<div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 56px 22px 120px 22px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7A5468">Sábado, 7 de novembro</p>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1.1; color: #4A1F3D">Oi, Gabriela</h1>
</div>
<div aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #F9D5E1; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; color: #8E1F4C">G</div>
</div>

<div style="background: #C2336A; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; color: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<p style="margin: 0; font-size: 15px; font-weight: 700">Progresso de hoje</p>
<p style="margin: 0; font-size: 15px; font-weight: 800">{{doneCount}} de {{total}}</p>
</div>
<div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,0.3); overflow: hidden">
<div style="height: 10px; border-radius: 5px; background: #FFFFFF; width: {{pct}}"></div>
</div>
<p style="margin: 0; font-size: 14px">{{message}}</p>
</div>

<div style="display: flex; gap: 8px">
<button style="min-height: 40px; padding: 0 18px; border-radius: 20px; border: none; background: #4A1F3D; color: #FFFFFF; font: 700 14px Nunito, sans-serif">Hoje</button>
<button style="min-height: 40px; padding: 0 18px; border-radius: 20px; border: 1.5px solid #EBC3D2; background: #FFFFFF; color: #4A1F3D; font: 700 14px Nunito, sans-serif">Semana</button>
<button style="min-height: 40px; padding: 0 18px; border-radius: 20px; border: 1.5px solid #EBC3D2; background: #FFFFFF; color: #4A1F3D; font: 700 14px Nunito, sans-serif">Todas</button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 600">Para fazer</h2>
<sc-for list="{{pending}}" as="t" hint-placeholder-count="4">
<div style="background: #FFFFFF; border-radius: 18px; padding: 14px 14px 14px 10px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 10px rgba(122,40,80,0.07)">
<button onClick="{{t.toggle}}" aria-label="Concluir {{t.title}}" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 24px; height: 24px; border-radius: 8px; border: 2px solid #C2336A; box-sizing: border-box"></span>
</button>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<p style="margin: 0; font-size: 16px; font-weight: 700">{{t.title}}</p>
<p style="margin: 0; font-size: 13px; color: #7A5468">{{t.meta}}</p>
</div>
<span style="flex-shrink: 0; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; background: {{t.tagBg}}; color: {{t.tagFg}}">{{t.tag}}</span>
</div>
</sc-for>
</div>

<sc-if value="{{hasDone}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 600">Concluídas</h2>
<sc-for list="{{done}}" as="t" hint-placeholder-count="1">
<div style="background: #FBE9EF; border-radius: 18px; padding: 10px 14px 10px 10px; display: flex; align-items: center; gap: 10px">
<button onClick="{{t.toggle}}" aria-label="Reabrir {{t.title}}" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 24px; height: 24px; border-radius: 8px; background: #C2336A; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
</span>
</button>
<p style="margin: 0; font-size: 15px; font-weight: 600; color: #7A5468; text-decoration: line-through">{{t.title}}</p>
</div>
</sc-for>
</div>
</sc-if>

</div>

<button aria-label="Nova tarefa" style="position: absolute; right: 22px; bottom: 100px; width: 60px; height: 60px; border-radius: 30px; border: none; background: #C2336A; box-shadow: 0 8px 20px rgba(194,51,106,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-radius: 26px 26px 0 0; box-shadow: 0 -4px 20px rgba(122,40,80,0.08); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
<a href="Main.dc.html" aria-current="page" style="min-width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #C2336A; font-size: 12px; font-weight: 800">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tarefas</a>
<a href="Agenda.dc.html" style="min-width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7A5468; font-size: 12px; font-weight: 700">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agenda</a>
<a href="Lembretes.dc.html" style="min-width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7A5468; font-size: 12px; font-weight: 700">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Lembretes</a>
<a href="Kanban.dc.html" style="min-width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7A5468; font-size: 12px; font-weight: 700">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v11"/></svg>Kanban</a>
<a href="Financas.dc.html" style="min-width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7A5468; font-size: 12px; font-weight: 700">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><path d="M16 15h2"/><path d="M6 6l9-3 1 3"/></svg>Finanças</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tasks: [
        { id: 1, title: 'Comprar flores para a sala', meta: 'Até 12:00', tag: 'Casa', done: false },
        { id: 2, title: 'Enviar relatório', meta: 'Até 17:00', tag: 'Trabalho', done: false },
        { id: 3, title: 'Treino de pilates', meta: '18:30', tag: 'Bem-estar', done: false },
        { id: 4, title: 'Ligar para a mãe', meta: 'À noite', tag: 'Pessoal', done: false },
        { id: 5, title: 'Regar as plantas', meta: 'Manhã', tag: 'Casa', done: true }
      ]
    };
  }
  renderVals() {
    var colors = {
      'Casa': { bg: '#FBE3EC', fg: '#8E1F4C' },
      'Trabalho': { bg: '#ECE4FA', fg: '#4F2C8A' },
      'Bem-estar': { bg: '#DFF3EA', fg: '#1F6B4A' },
      'Pessoal': { bg: '#FDECD9', fg: '#8A4A12' }
    };
    var self = this;
    var items = this.state.tasks.map(function (t) {
      var c = colors[t.tag] || colors['Casa'];
      return Object.assign({}, t, {
        tagBg: c.bg, tagFg: c.fg,
        toggle: function () {
          self.setState({ tasks: self.state.tasks.map(function (x) { return x.id === t.id ? Object.assign({}, x, { done: !x.done }) : x; }) });
        }
      });
    });
    var done = items.filter(function (t) { return t.done; });
    var pending = items.filter(function (t) { return !t.done; });
    var total = items.length;
    var message = pending.length === 0 ? 'Tudo feito! Hora de descansar.' : 'Faltam ' + pending.length + (pending.length === 1 ? ' tarefa. Você consegue!' : ' tarefas. Você consegue!');
    return {
      pending: pending, done: done, hasDone: done.length > 0,
      doneCount: done.length, total: total,
      pct: Math.round(done.length / total * 100) + '%',
      message: message
    };
  }
}
</script>
</body>
</html>
