<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gabi</title>
    <meta name="description" content="Tarefas, agenda, lembretes, kanban e finanças." />
    <meta name="theme-color" content="#C2336A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gabi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema salvo antes do app carregar (evita piscar na cor padrão).
      try {
        var t = JSON.parse(localStorage.getItem('gabi:theme') || 'null');
        if (t && t.vars) {
          for (var k in t.vars) document.documentElement.style.setProperty(k, t.vars[k]);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t.themeColor);
          document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', t.appleIcon);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
